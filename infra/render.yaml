services:
  - type: web
    name: oppo-kz-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >
      export PYTHONPATH="$(pwd)" && alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: prod
      - key: CORS_ORIGINS
        value: https://oppo-kz-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TIMEZONE
        value: Asia/Almaty
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: static
    name: oppo-kz-frontend
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://oppo-kz-backend.onrender.com
    autoDeploy: true
