name: Deploy and Smoke

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-and-smoke
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID || secrets.RENDER_STAGING_SERVICE_ID || secrets.RENDER_PRODUCTION_SERVICE_ID }}
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL || secrets.STAGING_APP_BASE_URL || secrets.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Echo resolved env (safe)
        run: |
          echo "APP_BASE_URL=${APP_BASE_URL:-<empty>}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check secrets
        run: python ops/check_secrets.py
      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS "${APP_BASE_URL}/api/v1/health"; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "⏳ Waiting for backend..."
            sleep 10
          done
          echo "❌ Backend never became healthy"
          exit 1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL || secrets.STAGING_APP_BASE_URL || secrets.APP_BASE_URL }}
      FRONT_URL: ${{ secrets.PROD_FRONT_URL || secrets.STAGING_FRONT_URL || secrets.FRONT_URL }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install requests
      - name: Print targets
        run: |
          echo "APP_BASE_URL=${APP_BASE_URL:-<empty>}"
          echo "FRONT_URL=${FRONT_URL:-<empty>}"
      - name: Run smoke
        run: python ops/smoke_http.py
