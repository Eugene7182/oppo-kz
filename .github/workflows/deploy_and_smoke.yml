name: Deploy and Smoke

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend quick checks
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install backend deps
        run: |
          if [ -f backend/requirements.txt ]; then
            cd backend
            python -m pip install --upgrade pip
            pip install -r requirements.txt || true
            python -m compileall -q app || true
          else
            echo "No backend/requirements.txt — skipping"
          fi

      # Frontend build
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build frontend
        run: |
          if [ -d frontend ]; then
            cd frontend
            npm ci || npm i
            npm run build
          else
            echo "No frontend dir — skipping"
          fi

  deploy:
    name: Deploy (Render API)
    runs-on: ubuntu-latest
    needs: build
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Check secrets early
        run: python ops/check_secrets.py

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Trigger backend deploy
        id: kick
        run: |
          set -e
          DEPLOY_ID=$(curl -sS -X POST \
            "https://api.render.com/v1/services/${RENDER_BACKEND_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' | jq -r '.id')
          echo "deploy_id=${DEPLOY_ID}" >> $GITHUB_OUTPUT
          echo "Triggered deploy: $DEPLOY_ID"

      - name: Wait until live
        env:
          DEPLOY_ID: ${{ steps.kick.outputs.deploy_id }}
        run: |
          set -e
          for i in $(seq 1 120); do
            STATUS=$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_BACKEND_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "Deploy status: $STATUS"
            if [ "$STATUS" = "live" ]; then exit 0; fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then exit 1; fi
            sleep 10
          done
          echo "Timeout waiting deploy"; exit 1

  smoke:
    name: Smoke tests (prod)
    runs-on: ubuntu-latest
    needs: deploy
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      FRONT_URL: ${{ secrets.FRONT_URL }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install requests
        run: pip install requests
      - name: Run smoke
        run: python ops/smoke_http.py
