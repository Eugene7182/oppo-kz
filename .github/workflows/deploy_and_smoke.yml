name: Deploy and Smoke

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend quick check
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          python -m compileall -q app || true

      # Frontend build
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm i
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Trigger backend deploy (Render)
        run: |
          set -e
          DEPLOY_ID=$(curl -sS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            --data '{}' | jq -r '.id')
          echo "deploy_id=${DEPLOY_ID}" >> $GITHUB_OUTPUT
        id: kick

      - name: Wait for deploy to be live
        env:
          DEPLOY_ID: ${{ steps.kick.outputs.deploy_id }}
        run: |
          set -e
          for i in $(seq 1 120); do
            STATUS=$(curl -sS "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "Deploy status: $STATUS"
            if [ "$STATUS" = "live" ]; then exit 0; fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then exit 1; fi
            sleep 10
          done
          echo "Timeout waiting deploy"; exit 1

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      FRONT_URL: ${{ secrets.FRONT_URL }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install requests
        run: pip install requests
      - name: Run smoke
        run: python ops/smoke_http.py
