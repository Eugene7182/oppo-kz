name: Deploy and Smoke

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:# job: deploy
env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID || secrets.RENDER_STAGING_SERVICE_ID || secrets.RENDER_PRODUCTION_SERVICE_ID }}
  APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL || secrets.STAGING_APP_BASE_URL || secrets.APP_BASE_URL }}

# job: smoke
env:
  APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL || secrets.STAGING_APP_BASE_URL || secrets.APP_BASE_URL }}
  FRONT_URL: ${{ secrets.PROD_FRONT_URL || secrets.STAGING_FRONT_URL || secrets.FRONT_URL }}
  ADMIN_USER: ${{ secrets.ADMIN_USER }}
  ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

  contents: read

concurrency:
  group: deploy-and-smoke
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (Render)
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # берём любой доступный SERVICE_ID (стейдж или прод)
      SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID || secrets.RENDER_STAGING_SERVICE_ID || secrets.RENDER_PRODUCTION_SERVICE_ID }}
      # URL бэка: prod если есть, иначе staging, иначе общий APP_BASE_URL
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL || secrets.STAGING_APP_BASE_URL || secrets.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Echo resolved env (safe)
        run: |
          echo "SERVICE_ID=${SERVICE_ID}"
          echo "APP_BASE_URL=${APP_BASE_URL:-<empty>}"

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Early check secrets/vars
        run: |
          python - << 'PY'
          import os, sys
          miss=[]
          if not os.getenv("RENDER_API_KEY"): miss.append("RENDER_API_KEY")
          if not os.getenv("SERVICE_ID"): miss.append("SERVICE_ID (RENDER_*_SERVICE_ID)")
          if miss:
              print("❌ Missing:", ", ".join(miss), file=sys.stderr); sys.exit(1)
          print("✅ Secrets/vars OK")
          PY

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Trigger backend deploy
        id: kick
        run: |
          set -e
          DEPLOY_ID=$(curl -sS -X POST \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' | jq -r '.id')
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Render API did not return deploy id"; exit 1
          fi
          echo "deploy_id=${DEPLOY_ID}" >> $GITHUB_OUTPUT
          echo "Triggered deploy: $DEPLOY_ID"

      - name: Wait until live
        env: { DEPLOY_ID: ${{ steps.kick.outputs.deploy_id }} }
        run: |
          set -e
          for i in $(seq 1 120); do
            STATUS=$(curl -sS \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "Deploy status: $STATUS"
            if [ "$STATUS" = "live" ]; then exit 0; fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then exit 1; fi
            sleep 10
          done
          echo "Timeout waiting deploy"; exit 1

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    env:
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL || secrets.STAGING_APP_BASE_URL || secrets.APP_BASE_URL }}
      FRONT_URL: ${{ secrets.PROD_FRONT_URL || secrets.STAGING_FRONT_URL || secrets.FRONT_URL }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install requests
        run: pip install requests
      - name: Print targets
        run: |
          echo "APP_BASE_URL=${APP_BASE_URL:-<empty>}"
          echo "FRONT_URL=${FRONT_URL:-<empty>}"
      - name: Run smoke
        run: python ops/smoke_http.py
