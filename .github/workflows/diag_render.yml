name: Diagnose Render
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID || secrets.RENDER_STAGING_SERVICE_ID || secrets.RENDER_PRODUCTION_SERVICE_ID }}
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL || secrets.STAGING_APP_BASE_URL || secrets.APP_BASE_URL }}
    steps:
      - name: Print inputs
        run: |
          test -n "$RENDER_API_KEY" || (echo "❌ No RENDER_API_KEY" && exit 1)
          test -n "$SERVICE_ID" || (echo "❌ No SERVICE_ID (RENDER_*_SERVICE_ID)" && exit 1)
          echo "SERVICE_ID=$SERVICE_ID"
          echo "APP_BASE_URL=${APP_BASE_URL:-<empty>}"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: GET service info (expect 200)
        run: |
          set -e
          RESP=$(curl -sS -w "\n%{http_code}" "https://api.render.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          BODY=$(echo "$RESP" | head -n-1)
          CODE=$(echo "$RESP" | tail -n1)
          echo "HTTP=$CODE"
          echo "$BODY" | jq . || echo "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "❌ Render API error. 401=bad API key, 404=bad SERVICE_ID (копируй srv-... из URL Render)"; exit 1
          fi
      - name: Probe health (expect 200)
        if: ${{ env.APP_BASE_URL != '' }}
        run: |
          set -e
          echo "GET ${APP_BASE_URL}/api/v1/health"
          curl -fsS "${APP_BASE_URL}/api/v1/health"
