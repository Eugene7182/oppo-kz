name: Backend CI

on:
  push:
    paths: [ "backend/**" ]
  pull_request:
    paths: [ "backend/**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: oppo
          POSTGRES_PASSWORD: oppo
          POSTGRES_DB: oppo
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U oppo -d oppo"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://oppo:oppo@localhost:5432/oppo
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: CiPass123!
      JWT_SECRET: ci_secret
      CORS_ORIGINS: http://localhost:5173,*

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # опционально: зафиксировать bcrypt до 4.1.2 если шумит
          # pip install 'bcrypt==4.1.2'
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: backend
        run: |
          pytest -q || (echo "Tests failed"; exit 1)
