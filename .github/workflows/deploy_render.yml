name: Deploy to Render
on:
  push: { branches: [ "main" ] }
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Быстрый smoke: статический анализ и сборки
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt || true
      - run: python -m compileall -q backend/app || true

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && (npm ci || npm i) && npm run build

      # Триггер деплоя на Render (Backend)
      - name: Trigger backend deploy
        if: ${{ secrets.RENDER_BACKEND_SERVICE_ID != '' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          set -e
          DEPLOY_ID=$(curl -sS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            --data '{}' | jq -r '.id')
          echo "Deploy: $DEPLOY_ID"
          for i in $(seq 1 120); do
            STATUS=$(curl -sS "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "Status: $STATUS"
            if [ "$STATUS" = "live" ]; then break; fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then exit 1; fi
            sleep 10
          done

      # Health check
      - name: Health check
        if: ${{ secrets.APP_BASE_URL != '' }}
        run: |
          set -e
          curl -fsSL "${{ secrets.APP_BASE_URL }}/api/v1/health"
          curl -fsSL "${{ secrets.APP_BASE_URL }}/api/v1/version" || curl -fsSL "${{ secrets.APP_BASE_URL }}/version"
