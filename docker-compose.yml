version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: oppo
      POSTGRES_USER: oppo
      POSTGRES_PASSWORD: oppo
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://oppo:oppo@db:5432/oppo
      ENV: dev
      CORS_ORIGINS: http://localhost:5173
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm i && npm run dev -- --host"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  dbdata: {}
